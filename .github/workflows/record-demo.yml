name: Record Demo

on:
  workflow_dispatch:
  push:
    branches: [promo-recording]
    paths:
      - 'ci/record-demo.sh'
      - '.github/workflows/record-demo.yml'

permissions:
  contents: read

concurrency:
  group: record-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record simulator autoplay
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and record
        run: bash ci/record-demo.sh
      - name: Save recording
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-${{ github.run_number }}
          path: build/demo.mov
          if-no-files-found: error
          retention-days: 3
      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
