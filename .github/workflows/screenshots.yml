name: App Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Simulator screenshots for iPhone and iPad
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and capture
        run: bash ci/screenshots.sh
      # 画像はリポジトリの別ブランチ（app-store-screenshots）に置く。毎回作り直す。
      - name: Publish to the screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan app-store-screenshots
          git rm -rq --cached .
          cp build/screenshots/*.png .
          git add ./*.png
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf origin app-store-screenshots
      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3
